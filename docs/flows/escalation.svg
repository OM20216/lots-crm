<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 370' font-family='Segoe UI, Arial, sans-serif' font-size='12.5'><defs><marker id='escalation-a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#9aa3ad'/></marker></defs><text x='24' y='34' font-size='15' font-weight='600' fill='#1f2328'>Escalation climbs a level each time its TAT passes</text><path d='M157 92H209' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M364 92H395' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M550 92H581' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M659 122V144H101V173' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M178 204H209' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M364 204H395' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M550 204H581' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M659 234V256H101V285' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><path d='M178 316H230' fill='none' stroke='#9aa3ad' stroke-width='1.25' marker-end='url(#escalation-a)'/><ellipse cx='101' cy='92' rx='56' ry='24' fill='#2f6fd6' fill-opacity='0.14' stroke='#2f6fd6' stroke-width='1.25'/><text x='101' y='97' text-anchor='middle' font-weight='600' fill='#1f2328'>Start</text><rect x='210' y='62' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='287' y='88' text-anchor='middle' fill='#1f2328'>Check store or</text><text x='287' y='104' text-anchor='middle' fill='#1f2328'>invoice no.</text><rect x='396' y='62' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='473' y='96' text-anchor='middle' fill='#1f2328'>Escalate</text><rect x='582' y='62' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='659' y='80' text-anchor='middle' fill='#1f2328'>First Time</text><text x='659' y='96' text-anchor='middle' fill='#1f2328'>Resolution: SPOC</text><text x='659' y='112' text-anchor='middle' fill='#1f2328'>and Cc</text><rect x='24' y='174' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='101' y='200' text-anchor='middle' fill='#1f2328'>Call the store</text><text x='101' y='216' text-anchor='middle' fill='#1f2328'>daily</text><rect x='210' y='174' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='287' y='208' text-anchor='middle' fill='#1f2328'>TAT passed: Level 1</text><rect x='396' y='174' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='473' y='208' text-anchor='middle' fill='#1f2328'>TAT passed: Level 2</text><rect x='582' y='174' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='659' y='200' text-anchor='middle' fill='#1f2328'>After Level 2:</text><text x='659' y='216' text-anchor='middle' fill='#1f2328'>daily reminder</text><rect x='24' y='286' width='154' height='60' rx='8' fill='#2e9e44' fill-opacity='0.14' stroke='#2e9e44' stroke-width='1.25'/><text x='101' y='304' text-anchor='middle' fill='#1f2328'>Store gives</text><text x='101' y='320' text-anchor='middle' fill='#1f2328'>resolution:</text><text x='101' y='336' text-anchor='middle' fill='#1f2328'>Resolved</text><ellipse cx='287' cy='316' rx='56' ry='24' fill='#2f6fd6' fill-opacity='0.14' stroke='#2f6fd6' stroke-width='1.25'/><text x='287' y='321' text-anchor='middle' font-weight='600' fill='#1f2328'>Stop</text></svg>