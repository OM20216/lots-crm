<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LOTS Support</title>
<style>
  :root{--red:#d7141a;--red-dark:#b00f14;--ink:#1d2230;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f6f8;--card:#fff;--ok:#15803d;--warn:#b45309;--info:#1d4ed8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Segoe UI',system-ui,-apple-system,sans-serif}
  h1,h2,h3{margin:0 0 8px}
  h2{font-size:16px}
  a{color:var(--info)}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
  .logo{background:var(--red);color:#fff;padding:2px 8px;border-radius:6px;letter-spacing:1px}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
  .field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  input,textarea,select{font:inherit;padding:9px 11px;border:1px solid #cfd4dc;border-radius:6px;background:#fff;width:100%;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:2px solid #fecaca;border-color:var(--red)}
  textarea{resize:vertical;min-height:80px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid #cfd4dc;background:#fff;color:var(--ink);cursor:pointer;font:inherit;font-weight:600;white-space:nowrap}
  .btn:hover{background:#f3f4f6}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn.primary:hover{background:var(--red-dark)}
  .btn.danger{color:#b91c1c;border-color:#fecaca}
  .btn.small{padding:5px 10px;font-size:12px}
  .block{width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .error{color:#b91c1c;margin:0}
  .topbar{background:var(--ink);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
  .topbar .brand{font-size:16px}
  .who{display:flex;align-items:center;gap:10px;font-size:13px}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.on{color:var(--ink);border-bottom-color:var(--red)}
  .row{display:flex;gap:10px;align-items:center}
  .row.between{justify-content:space-between}
  .row.top{align-items:flex-start}
  .grow{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid #cfd4dc;background:#fff;cursor:pointer;font:inherit;font-weight:500;font-size:13px}
  .chip:hover{border-color:var(--red);color:var(--red)}
  .articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .article{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit}
  .article:hover{background:#fafafa;border-color:#cbd5e1}
  .pre{white-space:pre-wrap;margin:0}
  .cols{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}
  .tlist{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:60vh;overflow:auto}
  .titem{text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px}
  .titem:hover{background:#fafafa}
  .titem.on{border-color:var(--red);box-shadow:0 0 0 2px #fee2e2}
  .titem .q{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .titem .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
  .status{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
  .status.Open{background:#fef3c7;color:#92400e}
  .status.Answered{background:#e0e7ff;color:#4338ca}
  .status.Closed{background:#dcfce7;color:#166534}
  .thread{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:52vh;overflow:auto}
  .msg{max-width:88%;padding:9px 12px;border-radius:10px;background:#f1f5f9}
  .msg .head{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
  .msg.from-agent{align-self:flex-start}
  .msg.from-manager{align-self:flex-end;background:#fee2e2}
  .msg.from-manager .head{color:#991b1b}
  .empty{padding:22px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
  .toast.bad{background:#b91c1c}
  .count{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700;vertical-align:middle}
  .notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px}
</style>
</head>
<body>

<div id="login" class="login">
  <form class="card login-card" id="loginForm">
    <div class="brand"><span class="logo">LOTS</span> Support</div>
    <p class="muted" style="margin:0">Raise a support token and chat with the help desk. This portal keeps working even when the CRM is down.</p>
    <label class="field"><span>Your name</span><input id="loginName" required autocomplete="off" placeholder="e.g. Kajal" /></label>
    <label class="field"><span>Access code</span><input id="loginCode" type="password" required autocomplete="off" /></label>
    <button class="btn primary block" type="submit">Open support</button>
    <p id="loginError" class="error" hidden></p>
    <p class="muted small" style="margin:0">The access code is set by the help desk manager.</p>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo">LOTS</span> Support</div>
    <div class="who">
      <span id="who"></span>
      <a id="crmLink" class="btn small" href="#" target="_blank" rel="noopener" hidden>Open CRM</a>
      <button id="signout" class="btn small">Switch user</button>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs">
      <button class="tab on" data-tab="help">Help articles</button>
      <button class="tab" data-tab="tokens">My tokens <span id="openCount" class="count" hidden>0</span></button>
    </nav>

    <section id="tab-help" class="panel">
      <div class="card">
        <h2>Ask about the CRM</h2>
        <form id="askForm" class="row">
          <input id="askInput" class="grow" placeholder="e.g. How does escalation work?" autocomplete="off" />
          <button class="btn primary" type="submit">Ask</button>
        </form>
        <div id="suggested" class="chips"></div>
      </div>
      <div id="answer" class="card" hidden></div>
      <div class="card">
        <h2>Help topics</h2>
        <div id="articles" class="articles"></div>
      </div>
    </section>

    <section id="tab-tokens" class="panel" hidden>
      <div id="tokenNotice" class="notice" hidden></div>
      <div class="cols">
        <div class="card">
          <div class="row between">
            <h2 style="margin:0">My tokens</h2>
            <button id="newToken" class="btn primary small">New token</button>
          </div>
          <div id="tokenList" class="tlist"></div>
        </div>
        <div class="card" id="detail">
          <p class="muted">Select a token to read the conversation, or raise a new one.</p>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const state = { name: '', code: '', tickets: [], selected: null, draft: '', timer: null, crmUrl: '' };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (iso) => (iso ? new Date(iso).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
  const ago = (iso) => {
    if (!iso) return '';
    const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' h ago';
    return Math.round(h / 24) + ' d ago';
  };

  function toast(text, bad) {
    const el = document.createElement('div');
    el.className = 'toast' + (bad ? ' bad' : '');
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'x-support-code': state.code, ...(opts.headers || {}) },
    });
    const body = await res.json().catch(() => ({ error: 'The support service sent an unreadable response' }));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    return body;
  }

  // ---------- sign in ----------

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#loginName').value.trim();
    const code = $('#loginCode').value;
    const err = $('#loginError');
    err.hidden = true;
    if (!name) return;
    state.name = name;
    state.code = code;
    try {
      await api('/api/tickets?agent=' + encodeURIComponent(name));
    } catch (ex) {
      state.name = '';
      state.code = '';
      err.textContent = ex.message === 'Access code required' ? 'That access code is not right.' : ex.message;
      err.hidden = false;
      return;
    }
    localStorage.setItem('lotsSupportName', name);
    localStorage.setItem('lotsSupportCode', code);
    boot();
  });

  $('#signout').addEventListener('click', () => {
    localStorage.removeItem('lotsSupportName');
    localStorage.removeItem('lotsSupportCode');
    clearInterval(state.timer);
    state.timer = null;
    $('#app').hidden = true;
    $('#login').hidden = false;
    $('#loginCode').value = '';
    $('#loginError').hidden = true;
  });

  // ---------- tabs ----------

  function showTab(name) {
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
    $('#tab-help').hidden = name !== 'help';
    $('#tab-tokens').hidden = name !== 'tokens';
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

  // ---------- help articles ----------

  async function loadOverview() {
    try {
      const o = await fetch('/api/overview').then((r) => r.json());
      state.crmUrl = o.crmUrl || '';
      if (state.crmUrl) {
        $('#crmLink').href = state.crmUrl;
        $('#crmLink').hidden = false;
      }
      $('#suggested').innerHTML = (o.suggested || [])
        .map((q) => '<button type="button" class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>')
        .join('');
      $('#suggested').querySelectorAll('.chip').forEach((b) =>
        b.addEventListener('click', () => {
          $('#askInput').value = b.dataset.q;
          ask(b.dataset.q);
        })
      );
      $('#articles').innerHTML = (o.articles || [])
        .map((a) => '<button type="button" class="article" data-id="' + esc(a.id) + '">' + esc(a.title) + '</button>')
        .join('');
      $('#articles').querySelectorAll('.article').forEach((b) =>
        b.addEventListener('click', () => openArticle(b.dataset.id))
      );
    } catch {
      $('#articles').innerHTML = '<p class="muted">Help topics are loading…</p>';
    }
  }

  function showAnswer(html) {
    const el = $('#answer');
    el.hidden = false;
    el.innerHTML = html;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function openArticle(id) {
    try {
      const a = await api('/api/articles/' + encodeURIComponent(id));
      showAnswer(
        '<h2>' + esc(a.title) + '</h2><p class="pre">' + esc(a.text) + '</p>' +
          '<div class="row" style="margin-top:12px"><button type="button" class="btn small" id="answerClose">Close</button></div>'
      );
      $('#answerClose').addEventListener('click', () => ($('#answer').hidden = true));
    } catch (ex) {
      toast(ex.message, true);
    }
  }

  async function ask(question) {
    const q = String(question || '').trim();
    if (!q) return;
    try {
      const r = await api('/api/ask', { method: 'POST', body: JSON.stringify({ question: q }) });
      if (r.answered) {
        showAnswer('<h2>' + esc(r.answer.title) + '</h2><p class="pre">' + esc(r.answer.text) + '</p>');
        return;
      }
      const related = (r.related || [])
        .map((a) => '<button type="button" class="article" data-id="' + esc(a.id) + '">' + esc(a.title) + '</button>')
        .join('');
      showAnswer(
        '<h2>I could not find that in the help articles</h2>' +
          '<p class="muted">' + esc(r.hint || 'Raise a support token and the help desk manager will answer.') + '</p>' +
          (related ? '<p class="small muted" style="margin-top:12px">Related topics</p><div class="articles">' + related + '</div>' : '') +
          '<div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="raiseFromAsk">Raise a support token</button></div>'
      );
      $('#answer').querySelectorAll('.article').forEach((b) => b.addEventListener('click', () => openArticle(b.dataset.id)));
      $('#raiseFromAsk').addEventListener('click', () => {
        showTab('tokens');
        openCompose(q);
      });
    } catch (ex) {
      toast(ex.message, true);
    }
  }

  $('#askForm').addEventListener('submit', (e) => {
    e.preventDefault();
    ask($('#askInput').value);
    $('#askInput').value = '';
  });

  // ---------- tokens ----------

  async function loadTickets() {
    try {
      const list = await api('/api/tickets?agent=' + encodeURIComponent(state.name));
      state.tickets = Array.isArray(list) ? list : [];
      if (state.selected && !state.tickets.some((t) => t.id === state.selected)) state.selected = null;
      renderList();
      const open = state.tickets.filter((t) => t.status !== 'Closed').length;
      $('#openCount').textContent = open;
      $('#openCount').hidden = !open;
      if (state.selected) {
        const t = state.tickets.find((x) => x.id === state.selected);
        if (t) renderDetail(t, false);
      }
    } catch (ex) {
      if (ex.message === 'Access code required') {
        toast('Your access code is no longer accepted. Sign in again.', true);
        $('#signout').click();
      } else {
        toast(ex.message, true);
      }
    }
  }

  function statusChip(s) {
    return '<span class="status ' + esc(s) + '">' + esc(s) + '</span>';
  }

  function renderList() {
    const el = $('#tokenList');
    if (!state.tickets.length) {
      el.innerHTML = '<div class="empty">No tokens yet.<br /><span class="small">Raise one when the help articles do not answer your question.</span></div>';
      return;
    }
    el.innerHTML = state.tickets
      .map(
        (t) =>
          '<button type="button" class="titem' + (t.id === state.selected ? ' on' : '') + '" data-id="' + esc(t.id) + '">' +
          '<span class="q">' + esc(t.question) + '</span>' +
          '<span class="meta"><span>' + esc(t.id) + ' · ' + statusChip(t.status) + '</span><span>' + esc(ago(t.updatedAt)) + '</span></span>' +
          '</button>'
      )
      .join('');
    el.querySelectorAll('.titem').forEach((b) =>
      b.addEventListener('click', () => selectTicket(b.dataset.id))
    );
  }

  async function selectTicket(id) {
    state.selected = id;
    state.draft = '';
    renderList();
    try {
      const t = await api('/api/tickets/' + encodeURIComponent(id) + '?agent=' + encodeURIComponent(state.name));
      renderDetail(t, true);
    } catch (ex) {
      toast(ex.message, true);
    }
  }

  function threadHtml(t) {
    const parts = [
      '<div class="msg from-agent"><div class="head">' + esc(t.agent) + ' · ' + esc(fmt(t.createdAt)) + '</div><div class="pre">' + esc(t.question) + '</div></div>',
    ];
    (t.replies || []).forEach((r) => {
      const cls = r.from === 'manager' ? 'from-manager' : 'from-agent';
      parts.push(
        '<div class="msg ' + cls + '"><div class="head">' + esc(r.by || (r.from === 'manager' ? 'Help desk' : t.agent)) + ' · ' + esc(fmt(r.at)) + '</div><div class="pre">' + esc(r.text) + '</div></div>'
      );
    });
    return parts.join('');
  }

  function renderDetail(t, scroll) {
    const el = $('#detail');
    const open = t.status !== 'Closed';
    const ctx = [t.context?.page, t.context?.caseId].filter(Boolean).map(esc).join(' · ');
    el.innerHTML =
      '<div class="row between top">' +
        '<div><h2 style="margin:0">' + esc(t.id) + ' ' + statusChip(t.status) + '</h2>' +
        '<div class="small muted" style="margin-top:4px">Raised ' + esc(fmt(t.createdAt)) + (ctx ? ' · ' + ctx : '') + '</div></div>' +
        (open ? '<button type="button" class="btn small danger" id="closeToken">Close token</button>' : '') +
      '</div>' +
      '<div class="thread" id="thread">' + threadHtml(t) + '</div>' +
      (open
        ? '<form id="replyForm"><textarea id="replyText" placeholder="Write to the help desk manager…">' + esc(state.draft) + '</textarea>' +
          '<div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn primary" type="submit">Send</button></div></form>'
        : '<p class="muted small">This token is closed. Raise a new token if you need more help.</p>');

    if (open) {
      $('#replyText').addEventListener('input', (e) => (state.draft = e.target.value));
      $('#replyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = $('#replyText').value.trim();
        if (!text) return;
        try {
          await api('/api/tickets/' + encodeURIComponent(t.id) + '?agent=' + encodeURIComponent(state.name), {
            method: 'PATCH',
            body: JSON.stringify({ action: 'message', reply: text }),
          });
          state.draft = '';
          await loadTickets();
          await selectTicket(t.id);
        } catch (ex) {
          toast(ex.message, true);
        }
      });
      $('#closeToken').addEventListener('click', async () => {
        if (!confirm('Close ' + t.id + '? You can still read it afterwards.')) return;
        try {
          await api('/api/tickets/' + encodeURIComponent(t.id) + '?agent=' + encodeURIComponent(state.name), {
            method: 'PATCH',
            body: JSON.stringify({ action: 'close' }),
          });
          await loadTickets();
          await selectTicket(t.id);
        } catch (ex) {
          toast(ex.message, true);
        }
      });
    }
    if (scroll) {
      const th = $('#thread');
      if (th) th.scrollTop = th.scrollHeight;
    }
  }

  function openCompose(prefill) {
    state.selected = null;
    state.draft = '';
    renderList();
    const el = $('#detail');
    el.innerHTML =
      '<h2>New support token</h2>' +
      '<p class="muted">Describe what you need from the help desk manager. You can keep replying on the token until it is closed.</p>' +
      '<form id="composeForm"><textarea id="composeText" style="min-height:120px" placeholder="Type your question…">' + esc(prefill || '') + '</textarea>' +
      '<div class="row" style="margin-top:8px;justify-content:flex-end"><button type="button" class="btn" id="composeCancel">Cancel</button><button class="btn primary" type="submit">Raise token</button></div></form>';
    $('#composeText').focus();
    $('#composeCancel').addEventListener('click', () => {
      el.innerHTML = '<p class="muted">Select a token to read the conversation, or raise a new one.</p>';
    });
    $('#composeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = $('#composeText').value.trim();
      if (!q) return;
      try {
        const t = await api('/api/tickets?agent=' + encodeURIComponent(state.name), {
          method: 'POST',
          body: JSON.stringify({ question: q, agent: state.name, context: { page: 'agent portal' } }),
        });
        state.draft = '';
        await loadTickets();
        await selectTicket(t.id);
        toast('Token ' + t.id + ' raised');
      } catch (ex) {
        toast(ex.message, true);
      }
    });
  }

  $('#newToken').addEventListener('click', () => openCompose(''));

  // ---------- boot ----------

  async function boot() {
    $('#login').hidden = true;
    $('#app').hidden = false;
    $('#who').textContent = state.name;
    showTab('help');
    await loadOverview();
    await loadTickets();
    clearInterval(state.timer);
    state.timer = setInterval(() => {
      loadTickets();
      if (state.selected) selectTicket(state.selected);
    }, 15000);
  }

  const savedName = localStorage.getItem('lotsSupportName');
  const savedCode = localStorage.getItem('lotsSupportCode');
  if (savedName && savedCode) {
    state.name = savedName;
    state.code = savedCode;
    api('/api/tickets?agent=' + encodeURIComponent(savedName))
      .then(boot)
      .catch(() => {
        state.name = '';
        state.code = '';
        localStorage.removeItem('lotsSupportName');
        localStorage.removeItem('lotsSupportCode');
      });
  } else {
    $('#loginName').focus();
  }
})();
</script>
</body>
</html>
